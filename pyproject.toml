[project]
name = "pocket-trader"
version = "2.0.0"
description = "Unofficial, community-driven Python API client for the Pocket Option trading platform - async WebSocket client, typed models, real-time streams, indicators, and risk utilities"
authors = [
    { name = "PocketTrader Team", email = "support@pocket-trader.io" },
    { name = "Yury \"lordralinc\" Yushmanov" }
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.9"

dependencies = [
    "python-socketio[asyncio-client]>=5.14.2,<7.0.0",
    "aiohttp[speedups]>=3.8.0,<4.0.0",
    "pydantic>=2.0.0,<3.0.0",
    "pytz>=2021.3,<2026.0",
    "brotli>=1.0.0,<2.0.0",
    "numpy>=1.21.0,<2.0.0",
    "pandas>=1.3.0,<2.0.0",
    "python-dotenv>=0.19.0,<2.0.0",
]

keywords = [
    "pocket option",
    "pocket-option",
    "pocketoption",
    "pocket option api",
    "pocket-trader",
    "unofficial",
    "trading",
    "binary options",
    "options",
    "finance",
    "fintech",
    "api",
    "api client",
    "websocket",
    "websocket client",
    "market data",
    "quotes",
    "forex",
    "crypto",
    "python client",
    "technical indicators",
    "risk management",
]

[project.urls]
Homepage = "https://github.com/ALSHAWAFI/pocket-option-api"
Repository = "https://github.com/ALSHAWAFI/pocket-option-api"
Documentation = "https://github.com/ALSHAWAFI/pocket-option-api/blob/main/README.md"
Issues = "https://github.com/ALSHAWAFI/pocket-option-api/issues"

[project.optional-dependencies]
speed = [
    "ujson>=5.0.0,<6.0.0",
    "orjson>=3.6.0,<4.0.0",
]
db = [
    "sqlalchemy>=1.4.0,<2.0.0",
]
ml = [
    "scikit-learn>=1.0.0,<2.0.0",
    "scipy>=1.7.0,<2.0.0",
]
full = [
    "ujson>=5.0.0,<6.0.0",
    "orjson>=3.6.0,<4.0.0",
    "sqlalchemy>=1.4.0,<2.0.0",
    "scikit-learn>=1.0.0,<2.0.0",
    "scipy>=1.7.0,<2.0.0",
]
dev = [
    "ruff>=0.14.0,<1.0.0",
    "pre-commit>=4.0.0,<5.0.0",
    "isort>=5.0.0,<6.0.0",
    "black>=24.0.0,<25.0.0",
    "rich>=13.0.0,<14.0.0",
    "jinja2>=3.0.0,<4.0.0",
    "pytest>=7.0.0,<8.0.0",
    "pytest-asyncio>=0.21.0,<1.0.0",
    "mypy>=1.0.0,<2.0.0",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312"]

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
use_parentheses = true
ensure_newline_before_comments = true
known_first_party = ["pocket_trader"]

[tool.ruff]
line-length = 100
respect-gitignore = true
target-version = "py39"
exclude = [
    "generator/templates",
    "tests/fixtures",
    "*.py.bak",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "T20", # flake8-print
    "PT",  # flake8-pytest-style
    "RUF", # ruff specific rules
]
ignore = [
    "E501",    # line too long (handled by black)
    "B008",    # avoid default argument calls
    "B904",    # raise from
    "C901",    # too complex
    "PLR0912", # too many branches
    "PLR0913", # too many arguments
    "PLR0915", # too many statements
    "SIM117",  # combine with statements
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # allow unused imports in __init__
"generator/*.py" = ["T201"]  # allow print in generator
"examples/*.py" = ["T201"]   # allow print in examples
"tests/*.py" = ["S101"]       # allow assert in tests

[tool.ruff.lint.isort]
known-first-party = ["pocket_trader"]
split-on-trailing-comma = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
disallow_untyped_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
exclude = [
    "generator/templates",
    "tests/fixtures",
    "docs",
]

[project.scripts]
generate-client = "pocket_trader.generator.generate:main"

[tool.setuptools.packages.find]
include = ["pocket_trader*"]
exclude = ["tests*", "docs*", "examples*", "generator/templates*"]

[tool.setuptools.package-data]
pocket_trader = ["py.typed", "generator/templates/*.jinja2", "generator/events.json"]